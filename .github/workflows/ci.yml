name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build game
        run: dotnet build game/Sandbox.csproj -warnaserror

      - name: Test simulation core
        run: dotnet test tests/Sandbox.Tests
